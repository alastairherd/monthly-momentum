[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "monthly-momentum"
version = "0.1.0"
description = "Monthly index-constituent momentum strategy CLI, mechanistic public data tracker, Rule 6 exit automation, and survivorship-bias-free backtester"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.9.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "yfinance>=0.2.50",
]

[project.scripts]
monthly-momentum = "monthly_momentum.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monthly_momentum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
